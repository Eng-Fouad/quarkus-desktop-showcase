name: Showcase

# The showcase against quarkus-desktop main on five platforms (see cycle.yml) : on every change of the showcase, and
# every night with the nightly variants too (the builder image, the runner images and quarkus-desktop move without the
# showcase). Manually : another quarkus-desktop commit, some of the platforms, the nightly variants.
on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
  schedule:
    # GitHub disables the schedule of a public repository after 60 days without activity
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      desktop-ref:
        description: quarkus-desktop branch, tag or commit
        default: main
      platforms:
        description: Platforms, a JSON array (Linux-arm64, Linux-x64, Windows-x64, Windows-arm64, macOS-arm64) ; empty for all five
        default: ''
      nightly:
        description: Also the nightly variants
        type: boolean
        default: false

permissions:
  contents: read

# one group per ref (a newer push cancels an older pull request run), one per manual run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cycle:
    uses: ./.github/workflows/cycle.yml
    with:
      showcase-repository: ${{ github.repository }}
      showcase-ref: ${{ github.sha }}
      desktop-ref: ${{ inputs.desktop-ref || 'main' }}
      platforms: ${{ inputs.platforms || '' }}
      nightly: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly) }}
