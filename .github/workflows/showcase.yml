name: Showcase

# The showcase against quarkus-desktop main : on every change of the showcase, and every night (the builder image and
# quarkus-desktop move without the showcase). Manually : another quarkus-desktop commit, other runners, the experimental
# Windows and macOS jobs.
on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
  schedule:
    # GitHub disables the schedule of a public repository after 60 days without activity
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      desktop-ref:
        description: quarkus-desktop branch, tag or commit
        default: main
      runners:
        description: Linux runners (JSON array)
        default: '["ubuntu-24.04-arm"]'
      windows:
        description: Experimental Windows cycle
        type: boolean
        default: false
      macos:
        description: Experimental macOS JVM runs
        type: boolean
        default: false

permissions:
  contents: read

# one group per ref (a newer push cancels an older pull request run), one per manual run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cycle:
    uses: ./.github/workflows/cycle.yml
    with:
      showcase-repository: ${{ github.repository }}
      showcase-ref: ${{ github.sha }}
      desktop-ref: ${{ inputs.desktop-ref || 'main' }}
      runners: ${{ inputs.runners || '["ubuntu-24.04-arm"]' }}
      windows: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
      macos: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
